name: Project Management

on:
  pull_request:
    types:
      - opened
      - reopened

jobs:
  add-to-project:
    name: Add to Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/tektronix/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}


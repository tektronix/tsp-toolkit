name: Dependency Bump

# Open (or refresh) a pull request that bumps one of the sibling Tektronix
# packages that this extension depends on.
#
# Producer repositories (tsp-toolkit-kic-cli, tsp-toolkit-language-interop,
# tsp-toolkit-script-gen, tsp-toolkit-trigger-flow) send a `dependency-bump`
# `repository_dispatch` event to this repository after they publish a release.
# This workflow updates `package.json`, regenerates `package-lock.json`, folds the
# upstream changelog entries into `CHANGELOG.md`, and opens a PR.
#
# Each producer gets its own, fixed PR branch (`chore/bump-<name>`), so a second
# release of the same package refreshes the existing PR instead of opening a new
# one.
#
# It can also be run manually from the Actions tab, which is the easiest way to
# retry a failed dispatch or to bump a package by hand.

on:
  repository_dispatch:
    types:
      - dependency-bump
  workflow_dispatch:
    inputs:
      name:
        description: 'Short name of the dependency, e.g. "kic-cli"'
        required: true
        type: string
      packages:
        description: 'Comma-separated npm package names to bump'
        required: true
        type: string
      version:
        description: 'Version to bump to, e.g. "0.23.0"'
        required: true
        type: string
      source_repo:
        description: 'Producer repository name, used to prefix CHANGELOG entries'
        required: false
        type: string
      target_branch:
        description: 'Branch to open the PR against. Blank picks the newest release/v* branch, or main.'
        required: false
        type: string

permissions:
  contents: read
  # Required for `secrets.GITHUB_TOKEN` to pull the build container and to read the
  # @tektronix packages from GitHub Packages. Declaring `permissions` at all sets
  # every scope that is not listed here to `none`.
  packages: read

jobs:
  bump:
    name: Bump ${{github.event.client_payload.name || inputs.name}}
    runs-on: ubuntu-latest
    # Use the same image as every other job in this repository, so the lock file is
    # regenerated by the same npm version that `npm ci` uses during CI.
    container:
      image: ghcr.io/tektronix/tsp-toolkit-build:latest
      credentials:
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the release/v* branches can be listed and checked out.
          fetch-depth: 0

      - name: Trust Workspace
        run: git config --global --add safe.directory "$PWD"

      - name: Resolve Inputs
        id: inputs
        env:
          # Dispatch payloads are read through the environment rather than
          # interpolated into the script body.
          IN_NAME: ${{github.event.client_payload.name || inputs.name}}
          IN_PACKAGES: ${{github.event.client_payload.packages && join(github.event.client_payload.packages, ',') || inputs.packages}}
          IN_VERSION: ${{github.event.client_payload.version || inputs.version}}
          IN_SOURCE_REPO: ${{github.event.client_payload.source_repo || inputs.source_repo}}
          IN_TARGET_BRANCH: ${{inputs.target_branch}}
        run: |
          set -euo pipefail

          for v in IN_NAME IN_PACKAGES IN_VERSION; do
            if [ -z "${!v}" ]; then
              echo "::error::'$v' is empty; nothing to bump."
              exit 1
            fi
          done

          # The active development branch is the highest-numbered release branch.
          # Fall back to `main` when a release branch has not been cut yet.
          TARGET="$IN_TARGET_BRANCH"
          if [ -z "$TARGET" ]; then
            TARGET="$(git branch --remotes --list 'origin/release/v*' \
                      | sed 's#.*origin/##' | sort --version-sort | tail -1)"
          fi
          if [ -z "$TARGET" ]; then
            TARGET=main
          fi
          echo "Opening PR against '$TARGET'"
          git switch "$TARGET"

          {
            echo "name=$IN_NAME"
            echo "packages=$IN_PACKAGES"
            echo "version=$IN_VERSION"
            echo "source_repo=${IN_SOURCE_REPO:-$IN_NAME}"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Tool Versions
        run: |
          node --version
          npm --version

      - name: Bump Versions and Lock File
        env:
          PACKAGES: ${{steps.inputs.outputs.packages}}
          VERSION: ${{steps.inputs.outputs.version}}
          NPM_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          set -euo pipefail

          # Authenticate through a throwaway user config so the credential is
          # never written into the committed .npmrc.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" > "$NPM_CONFIG_USERCONFIG"

          node .github/scripts/bump-dependencies.mjs \
            --manifest package.json \
            --packages "$PACKAGES" \
            --version "$VERSION"

          npm install --package-lock-only

          git --no-pager diff --stat

      - name: Merge Upstream Changelog Entries
        if: ${{github.event.client_payload.changelog != ''}}
        env:
          CHANGELOG_ENTRIES: ${{github.event.client_payload.changelog}}
          SOURCE_REPO: ${{steps.inputs.outputs.source_repo}}
        run: |
          set -euo pipefail
          printf '%s\n' "$CHANGELOG_ENTRIES" > "$RUNNER_TEMP/entries.md"
          node .github/scripts/merge-changelog.mjs \
            --target CHANGELOG.md \
            --entries "$RUNNER_TEMP/entries.md" \
            --source "$SOURCE_REPO"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (not `secrets.GITHUB_TOKEN`) is required here, otherwise the
          # resulting pull request will not trigger this repository's CI.
          # This is an organization Secret.
          token: ${{secrets.TSP_TOOLKIT_DEP_BUMP_PAT}}
          base: ${{steps.inputs.outputs.target}}
          branch: chore/bump-${{steps.inputs.outputs.name}}
          delete-branch: true
          commit-message: |
            chore(deps): bump ${{steps.inputs.outputs.name}} to ${{steps.inputs.outputs.version}}
          title: "chore(deps): bump ${{steps.inputs.outputs.name}} to ${{steps.inputs.outputs.version}}"
          labels: |
            dependencies
          body: |
            Automated bump of **${{steps.inputs.outputs.name}}** to
            `${{steps.inputs.outputs.version}}`.

            | | |
            |---|---|
            | Packages | `${{steps.inputs.outputs.packages}}` |
            | Upstream branch | `${{github.event.client_payload.source_ref}}` |
            | Upstream run | ${{github.event.client_payload.run_url}} |

            Before merging, please check that:

            - [ ] The `package-lock.json` diff only touches the bumped packages.
            - [ ] The `CHANGELOG.md` entries are worded and categorized correctly.
                  They are copied verbatim from the upstream changelog.

            <sub>Opened by the [Dependency Bump](${{github.server_url}}/${{github.repository}}/actions/workflows/dependency-bump.yml)
            workflow. Pushing to this branch is safe; the workflow only force-updates it
            when a newer version of the same package is released.</sub>
